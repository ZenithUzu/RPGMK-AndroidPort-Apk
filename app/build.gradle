plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zenithuzu.rpgmkport'
    compileSdk 34

    defaultConfig {
        applicationId 'com.zenithuzu.rpgmkport'
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName '0.9'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'long', 'BUILT_AT', "${System.currentTimeMillis()}L"
        buildConfigField 'String', 'ID', "\"${System.getenv('RPGMK_ID') ?: 'local'}\""
    }

    // Llave fija (la de depuración pública de Android, guardada en el repo): así cada versión
    // nueva se instala encima de la anterior. Los APK de los juegos usan otra firma, la del autor.
    buildFeatures { buildConfig true }

    signingConfigs {
        fija {
            storeFile file('firma-app.jks')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fija }
        release {
            signingConfig signingConfigs.fija
            minifyEnabled false
        }
    }
    // La plantilla va tal cual dentro de la app (ya es un APK comprimido)
    androidResources {
        noCompress 'apk'
    }
    packaging {
        resources {
            excludes += ['META-INF/*.version', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'junit:junit:4.13.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'io.github.reandroid:ARSCLib:1.3.5'      // editar el APK (id, nombre, icono)
    implementation 'com.android.tools.build:apksig:8.13.0'  // firmar, la misma de Android Studio
    implementation 'org.apache.commons:commons-compress:1.21' // leer el .zip elegido sin copiarlo
}
