# Compila la app y la publica en la versión "ultima" (para descargarla desde el teléfono)
name: APK
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Cada día: así toma sola la plantilla más nueva de RMXP-Android-Ports
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write

concurrency:
  group: apk-main
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Comprobar sincronización de la plantilla
        run: python3 -m unittest discover -s tests -v
      - name: Bajar la plantilla (motor sin juego) de RMXP-Android-Ports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets
          pcsha=$(gh api repos/ZenithUzu/portemon-pc/commits/main --jq .sha)
          curl -fsSL "https://raw.githubusercontent.com/ZenithUzu/portemon-pc/$pcsha/tools/rmxp_port.py" -o /tmp/rmxp_port.py
          motor=$(python3 - <<'PY'
          import ast
          tree = ast.parse(open('/tmp/rmxp_port.py', encoding='utf-8').read())
          print(next(ast.literal_eval(n.value) for n in tree.body if isinstance(n, ast.Assign)
                     and any(isinstance(t, ast.Name) and t.id == 'MOTOR_VERSION' for t in n.targets)))
          PY
          )
          # Esperar la plantilla del mismo motor; no publicar una app con una plantilla vieja.
          lista=false
          for intento in $(seq 1 180); do
            notas=$(gh api repos/ZenithUzu/portemon-pc/releases/tags/plantilla-ultima --jq .body 2>/dev/null || true)
            if [[ "$notas" == *"Motor $motor "* && "$notas" =~ Hecho\ de\ ([[:xdigit:]]{7,40}) ]]; then
              plantilla_sha=${BASH_REMATCH[1]}
              # El mismo motor no garantiza el mismo menú, recursos o parches.
              if gh api "repos/ZenithUzu/portemon-pc/compare/$plantilla_sha...$pcsha" |
                jq -e '(.status == "behind") or
                  ((.status == "ahead" or .status == "identical") and
                  (.files | length < 300) and
                  all(.files[]; (.filename | test("^(android/app/src/|android/app/build.gradle$|android/patches/|android/app/jni/|android/tools/)")) | not))' >/dev/null; then
                lista=true; break
              fi
            fi
            echo "Esperando plantilla de $motor ($intento/180)..."
            sleep 10
          done
          if [[ "$lista" != true ]]; then echo "La plantilla del motor actual todavia no esta lista"; exit 1; fi
          curl -fL -o app/src/main/assets/plantilla.apk \
            https://github.com/ZenithUzu/portemon-pc/releases/download/plantilla-ultima/plantilla.apk
      - name: Compilar
        run: |
          # Id de esta versión (código + plantilla): la app lo compara para avisar si hay una nueva
          echo "RPGMK_ID=${GITHUB_SHA::7}-$(sha256sum app/src/main/assets/plantilla.apk | cut -c1-7)" >> $GITHUB_ENV
          RPGMK_ID=${GITHUB_SHA::7}-$(sha256sum app/src/main/assets/plantilla.apk | cut -c1-7) ./gradlew --no-daemon testDebugUnitTest assembleRelease assembleDebug assembleDebugAndroidTest
      - name: Verificar firma y estructura del APK
        run: |
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$build_tools/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          "$build_tools/zipalign" -c -v 4 app/build/outputs/apk/release/app-release.apk
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probar instalación y apertura en Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install --no-streaming app/build/outputs/apk/release/app-release.apk
            adb install -r --no-streaming app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n com.zenithuzu.rpgmkport/.MainActivity
            sleep 3
            adb shell pidof com.zenithuzu.rpgmkport || { adb logcat -d -s AndroidRuntime; exit 1; }
            adb shell settings put secure immersive_mode_confirmations confirmed
            ./gradlew --no-daemon connectedDebugAndroidTest
            adb pull /sdcard/Pictures/portemon-ui capturas-android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portemon-android-ui
          path: |
            capturas-android
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Portemon.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima Portemon.apk --title "Portémon 0.7" \
            --notes "Compilada de ${GITHUB_SHA::7}. id: ${RPGMK_ID}. Descarga Portemon.apk desde el teléfono e instálala."
