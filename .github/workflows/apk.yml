# Compila la app y la publica en la versión "ultima" (para descargarla desde el teléfono)
name: APK
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Cada día: así toma sola la plantilla más nueva de RMXP-Android-Ports
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write

concurrency:
  group: apk-main
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Comprobar sincronización de la plantilla
        run: python3 -m unittest discover -s tests -v
      - name: Bajar la plantilla (motor sin juego) de RMXP-Android-Ports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets
          pcsha=$(gh api repos/ZenithUzu/RMXP-Android-Ports/commits/main --jq .sha)
          curl -fsSL "https://raw.githubusercontent.com/ZenithUzu/RMXP-Android-Ports/$pcsha/tools/rmxp_port.py" -o /tmp/rmxp_port.py
          motor=$(python3 - <<'PY'
          import ast
          tree = ast.parse(open('/tmp/rmxp_port.py', encoding='utf-8').read())
          print(next(ast.literal_eval(n.value) for n in tree.body if isinstance(n, ast.Assign)
                     and any(isinstance(t, ast.Name) and t.id == 'MOTOR_VERSION' for t in n.targets)))
          PY
          )
          # Esperar la plantilla del mismo motor; no publicar una app con una plantilla vieja.
          lista=false
          for intento in $(seq 1 180); do
            notas=$(gh api repos/ZenithUzu/RMXP-Android-Ports/releases/tags/plantilla-ultima --jq .body 2>/dev/null || true)
            if [[ "$notas" == *"Motor $motor "* && "$notas" =~ Hecho\ de\ ([[:xdigit:]]{7,40}) ]]; then
              plantilla_sha=${BASH_REMATCH[1]}
              # El mismo motor no garantiza el mismo menú, recursos o parches.
              if gh api "repos/ZenithUzu/RMXP-Android-Ports/compare/$plantilla_sha...$pcsha" |
                jq -e '(.status == "behind") or
                  ((.status == "ahead" or .status == "identical") and
                  (.files | length < 300) and
                  all(.files[]; (.filename | test("^(android/app/src/|android/app/build.gradle$|android/patches/|android/app/jni/|android/tools/)")) | not))' >/dev/null; then
                lista=true; break
              fi
            fi
            echo "Esperando plantilla de $motor ($intento/180)..."
            sleep 10
          done
          if [[ "$lista" != true ]]; then echo "La plantilla del motor actual todavia no esta lista"; exit 1; fi
          curl -fL -o app/src/main/assets/plantilla.apk \
            https://github.com/ZenithUzu/RMXP-Android-Ports/releases/download/plantilla-ultima/plantilla.apk
      - name: Compilar
        run: |
          # Id de esta versión (código + plantilla): la app lo compara para avisar si hay una nueva
          echo "RPGMK_ID=${GITHUB_SHA::7}-$(sha256sum app/src/main/assets/plantilla.apk | cut -c1-7)" >> $GITHUB_ENV
          RPGMK_ID=${GITHUB_SHA::7}-$(sha256sum app/src/main/assets/plantilla.apk | cut -c1-7) ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk RPGMK-Port.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima RPGMK-Port.apk --title "Última versión" \
            --notes "Compilada de ${GITHUB_SHA::7}. id: ${RPGMK_ID}. Descarga RPGMK-Port.apk desde el teléfono e instálala."
